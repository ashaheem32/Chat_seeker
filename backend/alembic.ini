# ============================================================================
# Alembic configuration for ChatLens.
# ----------------------------------------------------------------------------
# DB URL is intentionally NOT set here — env.py reads it from
# app.core.config.settings so the same source of truth drives the app and
# migrations. This file only carries Alembic's own structural config.
# ============================================================================

[alembic]
# Migration scripts live in ./alembic/ relative to this file.
script_location = %(here)s/alembic

# Filename template: 0001_short_slug.py, 0002_*, ... — easier to scan than UUIDs.
file_template = %%(rev)s_%%(slug)s

# Run from the backend/ dir so `app.*` imports resolve.
prepend_sys_path = .

# Use OS-aware path separators.
path_separator = os

# Timezone for embedded timestamps inside generated revision files.
timezone = UTC

# Note: sqlalchemy.url is set programmatically in env.py.

[post_write_hooks]
# Auto-format generated revision files with ruff.
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

# ----------------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
