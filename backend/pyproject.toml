# ============================================================================
# ChatLens Backend - Poetry Configuration
# ----------------------------------------------------------------------------
# FastAPI + async SQLAlchemy + Celery stack. Pinned to Python 3.12 because
# pgvector's Python bindings and modern pydantic v2 features (e.g. computed
# fields) work best there.
# ============================================================================

[tool.poetry]
name = "chatlens-backend"
version = "0.1.0"
description = "ChatLens API - AI-powered chat analysis backend"
authors = ["ChatLens Team"]
readme = "README.md"
package-mode = false  # this is an application, not a library

[tool.poetry.dependencies]
python = "^3.12"

# --- Web framework ---------------------------------------------------------
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }  # standard => uvloop + httptools for perf
python-multipart = "^0.0.12"                              # required for FastAPI file uploads

# --- Validation / Settings -------------------------------------------------
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
email-validator = "^2.2.0"

# --- Database --------------------------------------------------------------
# SQLAlchemy 2.0 has first-class async support; asyncpg is the fastest
# PostgreSQL async driver. pgvector provides the Vector column type.
sqlalchemy = { extras = ["asyncio"], version = "^2.0.35" }
asyncpg = "^0.30.0"
alembic = "^1.13.0"
pgvector = "^0.3.0"

# --- Caching / Queue -------------------------------------------------------
redis = { extras = ["hiredis"], version = "^5.1.0" }      # hiredis = C parser, much faster
celery = { extras = ["redis"], version = "^5.4.0" }
flower = "^2.0.1"                                         # Celery monitoring UI

# --- Async file IO ---------------------------------------------------------
aiofiles = "^24.1.0"
httpx = "^0.27.0"

# --- AI / LLM SDKs ---------------------------------------------------------
anthropic = "^0.39.0"
openai = "^1.54.0"
tiktoken = "^0.8.0"
tenacity = "^9.0.0"  # retry/backoff for OpenAI rate limits

# --- Auth / Security -------------------------------------------------------
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }

# --- Observability ---------------------------------------------------------
structlog = "^24.4.0"

# ----------------------------------------------------------------------------
# NLP group - heavy ML dependencies. Installed only on worker images, not on
# API containers, to keep the API image small. Install with:
#     poetry install --with nlp
# ----------------------------------------------------------------------------
[tool.poetry.group.nlp]
optional = true

[tool.poetry.group.nlp.dependencies]
# Transformer models (sentiment, emotion). torch is the heavyweight here -
# pinned to the 2.x line; the install resolver picks the CPU or CUDA build
# based on the platform.
transformers = "^4.45.0"
torch = "^2.4.0"
# Sentence embeddings, used by both KeyBERT and BERTopic.
sentence-transformers = "^3.2.0"
# Lightweight keyword + topic extraction.
keybert = "^0.8.5"
bertopic = "^0.16.3"
# Named entity recognition. The en_core_web_sm model is downloaded post-install.
spacy = "^3.7.5"
# Lexicon-based sentiment fallback when transformer models can't be loaded.
vadersentiment = "^3.3.2"
# Language detection for routing non-English text past models that only
# handle English.
langdetect = "^1.0.9"
# Faster tokenizers for the transformer models above.
tokenizers = "^0.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"            # used by FastAPI's TestClient
ruff = "^0.7.0"
mypy = "^1.13.0"
watchdog = "^6.0.0"          # for watchmedo auto-restart in dev

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ----------------------------------------------------------------------------
# Tooling configuration
# ----------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
